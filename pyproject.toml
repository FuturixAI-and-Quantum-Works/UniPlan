[project]
name = "uniplan"
version = "0.1.0"
description = "MCP server that turns a tender or PRD into a build plan (engineering brief, agent prompt, site GeoJSON, catalog needs) for UniCAD"
requires-python = ">=3.12"
# a subset of UniCAD's dependencies, so both servers share one bundled runtime
dependencies = [
    "mcp>=2.3.0",
    "pillow>=10",
    "pydantic>=2.8",
    "pymupdf>=1.24",
    "shapely>=2.0",
]

[project.scripts]
uniplan-mcp = "uniplan.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uniplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
